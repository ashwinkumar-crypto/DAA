<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>DAA Tracer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--panel:#12121a;--border:#1e1e2e;--accent:#00f5a0;--accent2:#ff6b35;--accent3:#7c3aed;--accent4:#06b6d4;--text:#e2e8f0;--muted:#64748b;--node-bg:#1a1a2e;--highlight:#ffd700;--compare:#ff6b35;--sorted:#00f5a0;--pivot:#a855f7;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;min-height:100vh;overflow-x:hidden;}
header{padding:16px 28px 12px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
header h1{font-family:'Syne',system-ui,sans-serif;font-size:1.4rem;font-weight:800;color:var(--accent);}
header span{font-size:.65rem;color:var(--muted);}
.layout{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 53px);height:calc(100dvh - 53px);}
.menu-btn,.scrim{display:none;}
.menu-btn{background:none;border:1px solid var(--border);color:var(--accent);font-size:1.1rem;border-radius:6px;width:40px;height:36px;cursor:pointer;align-self:center;}
.tbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 18px;border-bottom:1px solid var(--border);}
.tbar .grow{flex:1;min-width:120px;display:flex;align-items:center;gap:8px}
.tbar input[type=range]{min-width:80px}
.viz-area{-webkit-overflow-scrolling:touch;}
.rg{display:flex;align-items:center;gap:6px}
.sidebar{background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:10px 0;}
.sidebar-label{font-size:.55rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);padding:8px 14px 4px;}
.algo-btn{display:block;width:100%;background:none;border:none;color:var(--text);font-family:inherit;font-size:.72rem;text-align:left;padding:7px 14px;cursor:pointer;transition:all .15s;border-left:3px solid transparent;}
.algo-btn:hover{background:rgba(0,245,160,.05);color:var(--accent);}
.algo-btn.active{background:rgba(0,245,160,.1);border-left-color:var(--accent);color:var(--accent);}
.tag{font-size:.55rem;padding:1px 5px;border-radius:3px;margin-left:4px;background:rgba(124,58,237,.3);color:#a78bfa;}
.tag.g{background:rgba(6,182,212,.2);color:var(--accent4);}
.tag.dp{background:rgba(255,107,53,.2);color:var(--accent2);}
.tag.bt{background:rgba(255,215,0,.2);color:var(--highlight);}
.main{display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.controls{padding:8px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:46px;}
.ctrl-label{font-size:.58rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.ctrl-group{display:flex;align-items:center;gap:6px;}
input[type=number],input[type=text],select,textarea{background:var(--node-bg);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:.75rem;padding:5px 8px;border-radius:4px;}
input[type=number]{width:72px;}
input[type=text]{width:180px;}
textarea{width:420px;max-width:100%;height:150px;resize:vertical;white-space:pre;tab-size:4;}
.btn{font-family:inherit;font-size:.68rem;padding:5px 11px;border-radius:4px;border:1px solid;cursor:pointer;transition:all .15s;}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#000;font-weight:700;}
.btn-primary:hover{background:#00d488;}
.btn-secondary{background:transparent;border-color:var(--border);color:var(--text);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn:disabled{opacity:.4;cursor:default;}
.speed-range{accent-color:var(--accent);width:90px;}
.divider{width:1px;height:20px;background:var(--border);}
.step-count{font-size:.65rem;color:var(--muted);margin-left:auto;}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:12px 18px;gap:10px;min-height:0;}
.viz-area{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;overflow:auto;position:relative;flex:1;min-height:200px;}
.viz-title{font-size:.55rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);position:absolute;top:8px;left:11px;}
.viz-grid{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;padding-top:12px;}
.side-box{background:var(--node-bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-size:.66rem;}
.side-box .sb-title{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:4px;}
.pseudo-line{padding:1px 5px;border-radius:3px;white-space:pre-wrap;color:#94a3b8;border-left:2px solid transparent;}
.pseudo-line.on{background:rgba(0,245,160,.12);color:var(--accent);border-left-color:var(--accent);}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;}
.facts b{color:var(--accent4);font-weight:700;}
.log-panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;height:140px;overflow-y:auto;padding:8px 12px;flex-shrink:0;}
.log-title{font-size:.55rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:5px;}
.log-line{font-size:.67rem;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.03);display:flex;gap:6px;}
.log-step{color:var(--accent3);min-width:32px;}
.log-line.key{color:var(--accent);}
.log-line.swap{color:var(--accent2);}
.log-line.done{color:var(--accent);font-weight:700;}
.log-line.bad{color:#f87171;}
.status-bar{font-size:.7rem;color:var(--accent4);padding:2px 0;min-height:20px;}
.status-bar.err{color:#f87171;}
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:2px 0;}
.leg-item{display:flex;align-items:center;gap:4px;font-size:.58rem;color:var(--muted);}
.leg-dot{width:8px;height:8px;border-radius:2px;border:2px solid;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
/* array */
.iter-bar{width:100%;background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.3);border-radius:5px;padding:7px 12px;display:flex;gap:20px;margin-bottom:12px;flex-wrap:wrap;}
.iter-var{display:flex;align-items:center;gap:5px;}
.iter-var .vname{font-size:.6rem;color:var(--muted);}
.iter-var .vval{font-size:.8rem;font-weight:700;color:#a78bfa;min-width:24px;text-align:center;}
.cells{display:flex;flex-wrap:wrap;margin:4px 0 10px;}
.cell{display:flex;flex-direction:column;align-items:center;margin:2px;}
.cell-val{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:.82rem;font-weight:700;border:2px solid var(--border);border-radius:5px;background:var(--node-bg);transition:all .2s;}
.cell-idx{font-size:.5rem;color:var(--muted);margin-top:2px;}
.cell.dim{opacity:.3}
.cell-val.highlight{background:rgba(255,215,0,.2);border-color:var(--highlight);color:var(--highlight);box-shadow:0 0 10px rgba(255,215,0,.3);}
.cell-val.compare{background:rgba(255,107,53,.2);border-color:var(--compare);color:var(--compare);}
.cell-val.sorted{background:rgba(0,245,160,.15);border-color:var(--sorted);color:var(--sorted);}
.cell-val.pivot{background:rgba(168,85,247,.25);border-color:var(--pivot);color:var(--pivot);}
.cell-val.found{background:rgba(0,245,160,.3);border-color:var(--accent);color:var(--accent);animation:pulse .5s ease 3;}
.cell-val.current{border-color:var(--accent4);color:var(--accent4);background:rgba(6,182,212,.1);}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.row-label{font-size:.55rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:6px;}
/* svg */
svg text{font-family:inherit;}
/* tables */
.dp-table{border-collapse:collapse;font-size:.72rem;}
.dp-table th{color:var(--muted);font-weight:400;padding:4px 6px;text-align:left;white-space:nowrap;}
.dp-table td{border:1px solid var(--border);text-align:center;padding:5px 8px;min-width:32px;}
.dp-table td.act{background:rgba(6,182,212,.3);border-color:var(--accent4);}
.dp-table td.dep{background:rgba(255,215,0,.18);border-color:var(--highlight);}
.dp-table td.path{background:rgba(0,245,160,.2);border-color:var(--accent);}
.board{display:grid;gap:0;border:2px solid var(--border);width:max-content;}
.sq{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.sq.l{background:#1a1a2e}.sq.d{background:#12121a}
.sq.try{background:rgba(6,182,212,.35)}.sq.bad{background:rgba(255,107,53,.4)}.sq.att{background:rgba(255,107,53,.2)}
.sq.q{color:var(--accent)}
/* code tracer */
.code{background:var(--node-bg);border:1px solid var(--border);border-radius:6px;padding:6px 0;font-size:.72rem;overflow:auto;max-height:340px;}
.code div{display:flex;padding:0 8px;white-space:pre;}
.code .ln{color:var(--muted);min-width:28px;text-align:right;margin-right:10px;user-select:none;}
.code div.on{background:rgba(0,245,160,.12);border-left:3px solid var(--accent);padding-left:5px;}
.vtable{width:100%;border-collapse:collapse;font-size:.7rem;}
.vtable th{font-size:.55rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1px solid var(--border);}
.vtable td{padding:4px 8px;border-bottom:1px solid rgba(255,255,255,.04);}
.vtable td.v{color:var(--accent);font-weight:700;}
.vtable td.chg{background:rgba(255,215,0,.15);}
.out{background:#000;border:1px solid var(--border);border-radius:5px;padding:6px 10px;color:var(--accent);font-size:.75rem;min-height:30px;white-space:pre-wrap;}
.note{font-size:.62rem;color:var(--muted);margin-top:8px;line-height:1.5;}

/* ---------- responsive ---------- */
@media(max-width:900px){
  body{overflow-x:hidden}
  header{padding:10px 14px;position:sticky;top:0;z-index:30;background:var(--bg);gap:10px;align-items:center}
  header h1{font-size:1.15rem}
  header span{display:none}
  .menu-btn{display:block}
  .layout{display:block;height:auto}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:min(82vw,300px);z-index:50;transform:translateX(-102%);transition:transform .22s ease;border-right:1px solid var(--border);padding-top:calc(10px + env(safe-area-inset-top));box-shadow:none}
  body.menu-open .sidebar{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.6)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40}
  body.menu-open .scrim{display:block}
  body.menu-open{overflow:hidden}
  .algo-btn{padding:12px 16px;font-size:.8rem}
  .main{overflow:visible}
  .controls{padding:10px 14px;gap:10px}
  .ctrl-group{flex:1 1 100%;flex-wrap:wrap}
  .ctrl-group .ctrl-label{min-width:84px}
  .ctrl-group input[type=text],.ctrl-group select,.ctrl-group input[type=number]{flex:1;min-width:0;width:auto !important}
  input[type=number],input[type=text],select,textarea{font-size:16px;padding:9px 10px}
  textarea{width:100%;height:170px;font-size:14px}
  .tbar{position:sticky;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--border);border-bottom:none;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px;order:9;box-shadow:0 -6px 18px rgba(0,0,0,.5)}
  .tbar .btn{flex:1 1 auto;padding:11px 6px;font-size:.75rem;min-width:56px}
  .tbar .divider{display:none}
  .rg{flex:1 1 44%}
  .tbar input[type=range]{flex:1;min-width:70px;height:28px;width:auto !important}
  .speed-range{width:auto}
  .step-count{margin-left:0;flex:1 0 100%;text-align:center;order:-1}
  .main{display:flex;flex-direction:column}
  #controls{order:0}.content{order:1;overflow:visible;padding:10px 12px 14px}.tbar{order:2}
  .viz-area{padding:12px 10px;min-height:0;flex:none;overflow-x:auto}
  .viz-grid{grid-template-columns:1fr;gap:10px;padding-top:14px}
  .cell-val{width:36px;height:36px;font-size:.74rem}
  .cell{margin:1px}
  .sq{width:min(11vw,44px);height:min(11vw,44px);font-size:1.15rem}
  .board{grid-template-columns:repeat(var(--n),min(11vw,44px)) !important}
  .iter-bar{gap:10px 14px;padding:6px 10px}
  .log-panel{height:160px}
  .status-bar{font-size:.78rem;line-height:1.45;padding:8px 10px;order:-1;background:var(--panel);border:1px solid var(--border);border-radius:8px;position:sticky;top:58px;z-index:10}
  .legend{order:-1}
  .code{max-height:260px}
  .side-box{font-size:.7rem}
  .dp-table td{padding:4px 5px;min-width:26px}
}
@media(min-width:901px) and (max-width:1250px){.viz-grid{grid-template-columns:minmax(0,1fr) 210px}}
@media(hover:none){.algo-btn:hover{background:none;color:var(--text)}.algo-btn.active:hover{background:rgba(0,245,160,.1);color:var(--accent)}}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<header>
  <button class="menu-btn" id="menuBtn" aria-label="Open algorithm menu" aria-expanded="false">☰</button>
  <h1>DAA Tracer</h1>
  <span>Search · Sort · Graphs · DP · Backtracking · Branch &amp; Bound · Recursion · Code</span>
</header>
<div class="layout">
<div class="scrim" id="scrim"></div>
<nav class="sidebar" id="sidebar"></nav>
<div class="main">
  <div class="controls" id="controls"></div>
  <div class="controls tbar" id="tbar">
    <button class="btn btn-primary" id="runBtn">▶ Run</button>
    <button class="btn btn-secondary" id="prevBtn">◀ Prev</button>
    <button class="btn btn-secondary" id="stepBtn">Step ▶</button>
    <button class="btn btn-secondary" id="resetBtn">↺ Reset</button>
    <button class="btn btn-secondary" id="endBtn">End ⏭</button>
    <div class="divider"></div>
    <label class="rg"><span class="ctrl-label">Speed</span><input class="speed-range" type="range" id="speed" min="1" max="10" value="6" aria-label="Speed"></label>
    <label class="rg"><span class="ctrl-label">Step</span><input type="range" id="scrub" min="0" max="0" value="0" style="accent-color:var(--accent);width:160px" aria-label="Step slider"></label>
    <span class="step-count" id="stepCount">Step 0 / 0</span>
  </div>
  <div class="content">
    <div class="viz-area"><div class="viz-title" id="vizTitle">Visualization</div><div id="viz"></div></div>
    <div class="status-bar" id="status">Choose an algorithm and press Run.</div>
    <div class="legend" id="legend"></div>
    <div class="log-panel"><div class="log-title">Step log</div><div id="log"></div></div>
  </div>
</div>
</div>

}
function menu(open) { document.body.classList.toggle("menu-open", open); $("menuBtn").setAttribute("aria-expanded", open); }
$("menuBtn").onclick = () => menu(!document.body.classList.contains("menu-open"));
$("scrim").onclick = () => menu(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") menu(false); if (e.target.matches("input,textarea,select")) return; if (e.key === "ArrowRight") { $("stepBtn").click(); } if (e.key === "ArrowLeft") { $("prevBtn").click(); } if (e.key === " ") { e.preventDefault(); run(); } });
function sel(id) {
  menu(false);
  stop();
  S.algo = ALG[id];
  document.querySelectorAll(".algo-btn").forEach((b) => b.classList.toggle("active", b.dataset.id === id));
  buildControls(S.algo);
  $("vizTitle").textContent = S.algo.group.replace(/^\S+\s/, "") + " · " + S.algo.label;
  build(false);
}
function build(autoplay) {
  stop();
  $("status").classList.remove("err");
  try {
    S.view = S.algo.build(values());
    S.frames = S.view.frames; S.idx = 0;
    $("legend").innerHTML = (S.view.legend || []).map(([c, t]) => `<span class="leg-item"><span class="leg-dot" style="background:${c}33;border-color:${c}"></span>${t}</span>`).join("");
    $("scrub").max = Math.max(S.frames.length - 1, 0);
    show(true);
    if (autoplay) play();
  } catch (err) {
    S.frames = []; S.view = null;
    $("viz").innerHTML = ""; $("log").innerHTML = ""; $("legend").innerHTML = "";
    $("status").textContent = "⚠ " + err.message; $("status").classList.add("err");
    $("stepCount").textContent = "Step 0 / 0";
  }
}
function show(rebuildLog) {
  const n = S.frames.length; if (!n) return;
  S.idx = Math.max(0, Math.min(S.idx, n - 1));
  const f = S.frames[S.idx], v = S.view;
  let side = "";
  if (S.algo.group.indexOf("Graphs") >= 0) side = graphSide(f);
  else if (S.algo.id === "bnb") side = bbSide(f);
  else if (S.algo.id === "code") side = codeSide(f, S.idx, S.frames);
  const facts = v.facts && v.facts.length ? `<div class="side-box"><div class="sb-title">Facts</div><div class="facts">${v.facts.map(([k, x]) => `<span>${esc(k)}</span><b>${esc(x)}</b>`).join("")}</div></div>` : "";
  const pseudo = v.pseudo ? `<div class="side-box"><div class="sb-title">Pseudocode</div>${v.pseudo.map((l, i) => `<div class="pseudo-line ${i === lineOf(f) ? "on" : ""}">${esc(l)}</div>`).join("")}</div>` : "";
  $("viz").innerHTML = `<div class="viz-grid"><div style="min-width:0;overflow:auto">${v.render(f, S.idx, S.frames)}${v.note ? `<div class="note">${esc(v.note)}</div>` : ""}</div><div>${side}${pseudo}${facts}</div></div>`;
  if (S.algo.id === "bnb" || S.algo.id.indexOf("rec-") === 0) { const sc = $("viz").querySelector(".viz-grid > div"); if (sc) sc.scrollLeft = (sc.scrollWidth - sc.clientWidth) / 2; }
  $("status").textContent = msgOf(f);
  $("stepCount").textContent = `Step ${S.idx + 1} / ${n}`;
  $("scrub").value = S.idx;
  const log = $("log");
  if (rebuildLog || S.logged > S.idx + 1) { log.innerHTML = ""; S.logged = 0; }
  while (S.logged <= S.idx) { const k = S.logged, fr = S.frames[k]; const d = document.createElement("div"); d.className = "log-line " + typeOf(fr, k, n); d.innerHTML = `<span class="log-step">#${k + 1}</span><span>${esc(msgOf(fr))}</span>`; log.appendChild(d); S.logged++; }
  log.scrollTop = log.scrollHeight;
  $("prevBtn").disabled = S.idx === 0; $("stepBtn").disabled = S.idx >= n - 1;
}
function delay() { return Math.round(1500 / Math.pow(1.45, Number($("speed").value))) + 40; }
function play() {
  stop();
  if (S.idx >= S.frames.length - 1) S.idx = 0;
  const tick = () => { S.idx++; show(false); if (S.idx >= S.frames.length - 1) { stop(); return; } S.timer = setTimeout(tick, delay()); };
  S.timer = setTimeout(tick, delay()); $("runBtn").textContent = "⏸ Pause";
}
function stop() { clearTimeout(S.timer); S.timer = null; $("runBtn").textContent = "▶ Run"; }
function run() { if (S.timer) { stop(); return; } build(true); }
$("runBtn").onclick = run;
$("stepBtn").onclick = () => { stop(); S.idx++; show(false); };
$("prevBtn").onclick = () => { stop(); S.idx--; show(false); };
$("resetBtn").onclick = () => { stop(); S.idx = 0; show(true); };
$("endBtn").onclick = () => { stop(); S.idx = S.frames.length - 1; show(false); };
$("scrub").oninput = (e) => { stop(); S.idx = Number(e.target.value); show(false); };
buildSidebar();
sel("bubble");
</script>
</body>
</html>
